spring.application.name=jobflow

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/jobflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}

# Backblaze B2
b2.endpoint=https://s3.us-west-004.backblazeb2.com
b2.bucket-name=jobflow-resumes
b2.key-id=${B2_KEY_ID}
b2.application-key=${B2_APPLICATION_KEY}